<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f6ef7">
<title>计算机英语术语背诵手册</title>
<style>
  :root {
    --primary: #4f6ef7;
    --primary-dark: #3b55d9;
    --green: #22a06b;
    --red: #e5484d;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1c2333;
    --text-sub: #6b7280;
    --radius: 18px;
    --shadow: 0 10px 30px rgba(28, 35, 51, .10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef1fb 0%, #f7f8fc 55%, #eef4f2 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  header {
    padding: 14px 16px 8px;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
  }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  h1 small { color: var(--text-sub); font-weight: 500; font-size: 12px; margin-left: 8px; }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  select, .btn-ghost {
    appearance: none;
    border: 1px solid #dfe3ee;
    background: #fff;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }
  select { min-width: 130px; }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .btn-ghost.active { border-color: var(--red); color: var(--red); background: #fef0f0; }
  .badge {
    display: inline-block;
    min-width: 18px;
    padding: 0 5px;
    margin-left: 5px;
    background: var(--red);
    color: #fff;
    border-radius: 999px;
    font-size: 11px;
    line-height: 16px;
    text-align: center;
  }
  .stats { margin-left: auto; font-size: 13px; color: var(--text-sub); white-space: nowrap; }
  .stats b { color: var(--green); }
  .stats b.red { color: var(--red); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 16px 8px;
    width: 100%;
    max-width: 860px;
    margin: 0 auto;
  }
  .progress-wrap { width: 100%; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; background: #e4e8f4; border-radius: 3px; overflow: hidden; }
  .progress-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), #7c9bff); border-radius: 3px; transition: width .25s; }
  .progress-num { font-size: 12px; color: var(--text-sub); white-space: nowrap; }

  .scene { perspective: 1400px; width: 100%; max-width: 560px; }
  .card {
    position: relative;
    width: 100%;
    height: 340px;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.7,.3,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #c5cbe0 transparent;
  }
  .face::-webkit-scrollbar { width: 6px; }
  .face::-webkit-scrollbar-thumb { background: #c5cbe0; border-radius: 3px; }
  .face::-webkit-scrollbar-track { background: transparent; }
  .face-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
    width: 100%;
    min-height: 100%;
    box-sizing: border-box;
  }
  .face.back { transform: rotateY(180deg); background: linear-gradient(150deg, #ffffff, #f6f8ff); }
  .word {
    font-size: clamp(30px, 7vw, 52px);
    font-weight: 700;
    word-break: break-word;
    line-height: 1.2;
  }
  .word.zh { font-size: clamp(26px, 6vw, 42px); color: var(--primary-dark); font-weight: 600; }
  .ipa {
    margin-top: 10px;
    font-size: clamp(15px, 3.5vw, 20px);
    color: var(--text-sub);
    font-weight: 400;
    letter-spacing: .3px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .speak-btn {
    appearance: none;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 2px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: transform .12s, background .15s;
  }
  /* 隐藏时彻底移除布局（覆盖 inline-flex） */
  .speak-btn[hidden] { display: none !important; }
  .speak-btn svg { width: 20px; height: 20px; display: block; }
  .face.back .speak-btn { margin-top: 14px; }
  .speak-btn:hover { background: #eef1fb; }
  .speak-btn:active { transform: scale(.92); }
  .speak-btn.playing svg { animation: spk 1s ease-in-out infinite; }
  @keyframes spk { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
  .hint { margin-top: 18px; font-size: 13px; color: var(--text-sub); }
  .tag {
    position: absolute;
    top: 14px;
    left: 16px;
    font-size: 11px;
    color: var(--text-sub);
    background: #eef1fb;
    border-radius: 999px;
    padding: 3px 10px;
  }
  .known-dot {
    position: absolute;
    top: 14px;
    right: 16px;
    font-size: 11px;
    border-radius: 999px;
    padding: 3px 10px;
    background: #e8f7f0;
    color: var(--green);
  }
  .wrong-dot {
    position: absolute;
    top: 40px;
    right: 16px;
    font-size: 11px;
    border-radius: 999px;
    padding: 3px 10px;
    background: #fdebec;
    color: var(--red);
  }
  .pos { position: absolute; bottom: 12px; right: 16px; font-size: 11px; color: #b6bccb; }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    width: 100%;
    max-width: 560px;
  }
  .actions button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: transform .08s, filter .15s;
  }
  .actions button:active { transform: scale(.97); }
  #btnUnknown { background: var(--red); }
  #btnKnown { background: var(--green); }
  #btnFlip { background: var(--primary); width: 100%; max-width: 560px; flex: none; }
  .actions button[disabled] { opacity: .45; cursor: default; }

  .done-panel { text-align: center; max-width: 480px; }
  .done-panel h2 { font-size: 26px; margin-bottom: 10px; }
  .done-panel p { color: var(--text-sub); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }
  .done-panel button {
    display: block; width: 100%; margin-bottom: 10px;
    border: none; border-radius: 14px; padding: 13px 0;
    font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;
  }
  #btnAgainUnknown { background: var(--primary); }
  #btnRestart { background: #8a93a8; }

  footer {
    text-align: center;
    font-size: 11px;
    color: #b0b6c4;
    padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
  }
  kbd {
    background:#fff;border:1px solid #dfe3ee;border-bottom-width:2px;border-radius:5px;
    padding:1px 5px;font-size:11px;color:#5b6272;
  }
  @media (max-width: 480px) {
    .card { height: 280px; }
    .face-inner { padding: 22px 18px; }
    .stats { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>计算机英语 <small>点击卡片 · 看英文想中文</small></h1>
  <div class="toolbar">
    <select id="groupSel"></select>
    <button class="btn-ghost" id="btnShuffle">洗牌</button>
    <button class="btn-ghost" id="btnWrongBook">错题本<span class="badge" id="wrongBadge">0</span></button>
    <button class="btn-ghost" id="btnReset">清空进度</button>
    <span class="stats" id="statsLine"></span>
  </div>
</header>

<main>
  <div class="progress-wrap">
    <div class="progress-bar"><i id="progressFill"></i></div>
    <span class="progress-num" id="progressNum">0 / 0</span>
  </div>

  <div class="scene" id="study">
    <div class="card" id="card">
      <div class="face front">
        <div class="face-inner">
          <span class="tag" id="tagFront"></span>
          <span class="known-dot" id="knownDot" hidden>已掌握</span>
          <span class="wrong-dot" id="wrongDot" hidden>错题</span>
          <div class="word" id="wordFront"></div>
          <div class="ipa" id="ipaFront" hidden>
            <button class="speak-btn" id="speakFront" title="朗读" aria-label="朗读英语">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
            <span id="ipaText"></span>
          </div>
          <div class="hint">想一想中文意思，点击卡片查看</div>
          <span class="pos" id="posFront"></span>
        </div>
      </div>
      <div class="face back">
        <div class="face-inner">
          <span class="tag" id="tagBack"></span>
          <div class="word zh" id="wordBack"></div>
          <div class="hint" id="enBack"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="done-panel" id="done" hidden>
    <h2 id="doneTitle">本组完成 🎉</h2>
    <p id="doneText"></p>
    <button id="btnAgainUnknown">只复习未掌握的卡片</button>
    <button id="btnRestart">重新开始本组</button>
  </div>

  <div class="actions" id="actions">
    <button id="btnFlip">翻转卡片（空格）</button>
    <button id="btnUnknown" hidden>不认识 ←</button>
    <button id="btnKnown" hidden>认识 →</button>
  </div>
</main>

<footer>计算机自学 · 英语术语手册 · 答错自动收录错题本 · 10 大模块覆盖 408 统考/面试/论文</footer>

 "recursive", "zh": "递归的<br>a recursive definition", "group": "G10 高频固定搭配与动词", "ipa": "", "audio": "audio/recursive.mp3"}, {"en": "converge", "zh": "收敛<br>gradient descent converges", "group": "G10 高频固定搭配与动词", "ipa": "", "audio": "audio/converge.mp3"}, {"en": "emit / omit", "zh": "生成 / 省略<br>emit machine code；omit the parameter", "group": "G10 高频固定搭配与动词", "ipa": "/ɪmˈɪt/ /əʊmˈɪt/", "audio": "audio/emit_omit.mp3"}, {"en": "propose / evaluate / outperform", "zh": "提出 / 评估 / 优于<br>We propose a novel framework... / outperforms SOTA", "group": "G10 高频固定搭配与动词", "ipa": "/pɹəpˈəʊz/", "audio": "audio/propose_evaluate_outperform.mp3"}, {"en": "ablation study", "zh": "消融实验<br>verify contribution of each module", "group": "G10 高频固定搭配与动词", "ipa": "", "audio": "audio/ablation_study.mp3"}, {"en": "generalize well", "zh": "泛化好<br>the model generalizes well to unseen data", "group": "G10 高频固定搭配与动词", "ipa": "/wˈɛl/", "audio": "audio/generalize_well.mp3"}, {"en": "the time complexity of", "zh": "…的时间复杂度<br>The time complexity of quicksort is O(n log n).", "group": "G10 高频固定搭配与动词", "ipa": "/ðə/ /tˈaɪm/ /ˈɒv/", "audio": "audio/the_time_complexity_of.mp3"}, {"en": "in the wild", "zh": "在真实环境中<br>tested in the wild", "group": "G10 高频固定搭配与动词", "ipa": "/ˈɪn/ /ðə/", "audio": "audio/in_the_wild.mp3"}, {"en": "end-to-end", "zh": "端到端<br>an end-to-end solution", "group": "G10 高频固定搭配与动词", "ipa": "/ˈɛnd/ /tˈuː/ /ˈɛnd/", "audio": "audio/end_to_end.mp3"}, {"en": "real-world scenario", "zh": "真实场景<br>in a real-world scenario", "group": "G10 高频固定搭配与动词", "ipa": "", "audio": "audio/real_world_scenario.mp3"}, {"en": "minimize / maximize", "zh": "最小化 / 最大化<br>minimize the loss function", "group": "G10 高频固定搭配与动词", "ipa": "", "audio": "audio/minimize_maximize.mp3"}];
const $ = id => document.getElementById(id);
const KNOWN_KEY = 'cs_known';
const WRONG_KEY = 'cs_wrong';
const store = {
  get known() { try { return new Set(JSON.parse(localStorage.getItem(KNOWN_KEY) || '[]')); } catch { return new Set(); } },
  set known(set) { localStorage.setItem(KNOWN_KEY, JSON.stringify([...set])); },
  get wrong() { try { return new Set(JSON.parse(localStorage.getItem(WRONG_KEY) || '[]')); } catch { return new Set(); } },
  set wrong(set) { localStorage.setItem(WRONG_KEY, JSON.stringify([...set])); }
};

let known = store.known;
let wrong = store.wrong;
let mode = 'study';        // 'study' 正常学习 | 'wrong' 错题本
let queue = [];            // array of data indices
let cur = 0;               // pointer into queue
let flipped = false;
let filtered = DATA.map((_, i) => i); // current group filter

// ---------- group select ----------
const groupSel = $('groupSel');
const groups = [...new Set(DATA.map(d => d.group))];
groupSel.innerHTML = '<option value="">全部（' + DATA.length + '）</option>' +
  groups.map(g => {
    const n = DATA.filter(d => d.group === g).length;
    return `<option value="${g}">${g}（${n}）</option>`;
  }).join('');
groupSel.onchange = () => {
  filtered = DATA.map((d, i) => ({ d, i })).filter(x => !groupSel.value || x.d.group === groupSel.value).map(x => x.i);
  buildQueue();
};

// ---------- header stats / mode ----------
function updateHeader() {
  $('btnWrongBook').classList.toggle('active', mode === 'wrong');
  $('btnWrongBook').innerHTML = mode === 'wrong'
    ? '返回学习'
    : '错题本<span class="badge">' + wrong.size + '</span>';
  $('statsLine').innerHTML = mode === 'wrong'
    ? '错题待消除 <b class="red">' + wrong.size + '</b>'
    : '已掌握 <b>' + known.size + '</b> / <span>' + DATA.length + '</span>';
}

// ---------- queue ----------
function buildQueue() {
  let list = filtered.slice();
  if (mode === 'wrong') list = list.filter(i => wrong.has(DATA[i].en));
  queue = list;
  cur = 0;
  $('done').hidden = true;
  $('study').style.display = '';
  $('actions').style.visibility = '';
  updateHeader();
  render();
}
function restartGroup() { buildQueue(); }
function reviewUnknown() {
  queue = filtered.filter(i => !known.has(DATA[i].en));
  cur = 0;
  $('done').hidden = true;
  $('study').style.display = '';
  $('actions').style.visibility = '';
  render();
}

// ---------- render ----------
let backFillTimer = null;
function render() {
  if (queue.length === 0 || cur >= queue.length) { renderDone(); return; }
  const d = DATA[queue[cur]];
  const wasFlipped = flipped;
  if (backFillTimer) { clearTimeout(backFillTimer); backFillTimer = null; }
  flipped = false;
  $('card').classList.remove('flipped');
  $('btnFlip').hidden = false;
  $('btnFlip').disabled = false;
  $('btnUnknown').hidden = true;
  $('btnKnown').hidden = true;
  // 正面内容立即更新（翻回时正面后半段才可见，安全）
  $('wordFront').innerHTML = d.en;
  $('ipaText').textContent = d.ipa || '';
  $('ipaFront').hidden = !d.ipa;
  // 英语正面：有 MP3 就显示喇叭（法律类卡虽无 IPA 但有 MP3 也会显示）
  $('speakFront').hidden = !d.audio;
  $('tagFront').textContent = d.group;
  $('knownDot').hidden = mode === 'wrong' || !known.has(d.en);
  $('wrongDot').hidden = !wrong.has(d.en);
  $('posFront').textContent = `${cur + 1} / ${queue.length}`;
  $('btnKnown').textContent = mode === 'wrong' ? '答对了 →' : '认识 →';
  $('btnUnknown').textContent = mode === 'wrong' ? '还没记住 ←' : '不认识 ←';
  $('progressFill').style.width = (cur / queue.length * 100) + '%';
  $('progressNum').textContent = `${cur} / ${queue.length}`;
  // 答案（背面）内容：若当前已翻转，翻回动画前半段背面仍可见，
  // 先清空避免新答案闪现，等动画过半（约 250ms）背面不可见时再填入
  if (wasFlipped) {
    $('wordBack').innerHTML = '';
    $('enBack').textContent = '';
    $('tagBack').textContent = '';
    backFillTimer = setTimeout(() => {
      $('wordBack').innerHTML = d.zh;
      $('tagBack').textContent = d.group;
      $('enBack').textContent = d.en + (d.ipa ? '  ' + d.ipa : '');
      backFillTimer = null;
    }, 250);
  } else {
    $('wordBack').innerHTML = d.zh;
    $('tagBack').textContent = d.group;
    $('enBack').textContent = d.en + (d.ipa ? '  ' + d.ipa : '');
  }
  updateHeader();
}

function renderDone() {
  $('study').style.display = 'none';
  $('done').hidden = false;
  $('actions').style.visibility = 'hidden';
  if (mode === 'wrong') {
    const wrongInFilter = filtered.filter(i => wrong.has(DATA[i].en)).length;
    $('doneTitle').textContent = wrongInFilter === 0 ? '错题全部消除 🎉' : '本轮错题过完 🎉';
    $('doneText').textContent = wrongInFilter === 0
      ? '当前范围的错题都已重新答对。' + (wrong.size === 0 ? '错题本已清空，继续保持！' : '其他分组还有错题，可切换分组继续。')
      : `还有 ${wrongInFilter} 张错题未消除，再练一遍直到全部答对。`;
    $('btnAgainUnknown').hidden = true;
    $('btnRestart').textContent = wrongInFilter === 0 ? '返回学习' : '再练一遍错题';
  } else {
    const unknownInFilter = filtered.filter(i => !known.has(DATA[i].en)).length;
    $('doneTitle').textContent = '本组完成 🎉';
    $('doneText').textContent = unknownInFilter === 0
      ? '太棒了！当前范围的卡片全部掌握。'
      : `本组完成，当前范围还有 ${unknownInFilter} 张未掌握。`;
    $('btnAgainUnknown').hidden = unknownInFilter === 0;
    $('btnRestart').textContent = '重新开始本组';
  }
  $('progressFill').style.width = '100%';
  $('progressNum').textContent = `${queue.length} / ${queue.length}`;
  updateHeader();
}

// ---------- audio playback (MP3 files, desktop + mobile) ----------
let _audioCache = {};          // rel(url) -> Audio element
const _audioRev = String(Date.now());  // 会话固定版本号，绕过 HTTP 缓存的旧 404

function audioUrl(rel) {
  if (!rel) return '';
  const p = location.pathname.replace(/index\.html$/, '').replace(/\/$/, '');
  const segs = p.split('/').filter(Boolean);
  const up = '../'.repeat(Math.max(0, segs.length - 1));
  return new URL(up + rel, document.baseURI).href;
}

function playAudio(url, btn) {
  if (!url) return;
  // 停掉上一条不同音频
  const prev = _audioCache['_current'];
  if (prev && prev !== _audioCache[url]) {
    try { prev.pause(); prev.currentTime = 0; } catch(e) {}
  }
  let a = _audioCache[url];
  // 首次创建 或 之前 error 过 → 重建（Chrome 可能记住 error 状态）
  if (!a || a.error) {
    a = new Audio();
    a.preload = 'none';
    // 首次 src 带会话版本号，绕过 HTTP 缓存的旧 404 响应
    a.src = url + (url.includes('?') ? '&' : '?') + 'v=' + _audioRev;
    _audioCache[url] = a;
  }
  _audioCache['_current'] = a;
  // 注意：不再每次都 a.src = url，避免触发 abort 正在加载的请求
  if (btn) { btn.classList.add('playing'); }
  const cleanup = () => { if (btn) btn.classList.remove('playing'); };
  a.onended = cleanup; a.onerror = cleanup;
  try { a.play().catch(e => { console.warn('audio play failed:', e); cleanup(); }); } catch(e) { cleanup(); }
}

$('speakFront').addEventListener('click', e => {
  e.stopPropagation(); e.preventDefault();
  const d = DATA[queue[cur]];
  if (d.audio) { playAudio(audioUrl(d.audio), $('speakFront')); }
});

// ---------- interactions ----------
function flip() {
  if ($('done').hidden === false) return;
  flipped = !flipped;
  $('card').classList.toggle('flipped', flipped);
  $('btnFlip').hidden = flipped;
  $('btnUnknown').hidden = !flipped;
  $('btnKnown').hidden = !flipped;
}
function afterAnswer() {
  flipped = false;
  updateHeader();
  render();
  $('actions').style.visibility = '';
}
$('card').onclick = flip;
$('btnFlip').onclick = flip;
// 正常模式：认识=加入已掌握；错题本：答对=从错题本消除
$('btnKnown').onclick = () => {
  const d = DATA[queue[cur]];
  if (mode === 'wrong') {
    wrong.delete(d.en);
    store.wrong = wrong;
    queue.splice(cur, 1);          // 不前进，下一张移到当前位置
  } else {
    known.add(d.en);
    store.known = known;
    cur++;
  }
  afterAnswer();
};
// 任何模式下不认识都收录错题本，并排到队尾再出现
$('btnUnknown').onclick = () => {
  const d = DATA[queue[cur]];
  wrong.add(d.en);
  store.wrong = wrong;
  queue.push(queue[cur]);
  if (mode === 'wrong') queue.splice(cur, 1);
  else cur++;
  afterAnswer();
};
$('btnShuffle').onclick = () => {
  for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
  cur = 0; render();
};
$('btnReset').onclick = () => {
  if (!confirm('确定清空所有已掌握记录？（错题本不受影响，需在错题本内答对消除）')) return;
  known = new Set(); store.known = known;
  buildQueue();
};
$('btnWrongBook').onclick = () => {
  mode = mode === 'study' ? 'wrong' : 'study';
  buildQueue();
};
$('btnAgainUnknown').onclick = () => { $('actions').style.visibility = ''; reviewUnknown(); };
$('btnRestart').onclick = () => {
  $('actions').style.visibility = '';
  if (mode === 'wrong') buildQueue(); else restartGroup();
};

document.onkeydown = e => {
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight' && !$('btnKnown').hidden) $('btnKnown').click();
  else if (e.code === 'ArrowLeft' && !$('btnUnknown').hidden) $('btnUnknown').click();
};

buildQueue();
</script>
</body>
